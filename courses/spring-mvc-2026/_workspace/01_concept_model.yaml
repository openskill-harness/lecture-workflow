# 공통 개념 모델 — spring-mvc-2026 (v1.7 산출물, G1 직후 생성 / G2 재확정에서 승인 예정)
# 생성: research-agent
# 근거 brief: _workspace/03_research_L01-L02.md (S-01~S-16, C-01~C-18), _workspace/03_research_L03.md (S1~S7 claim)
# 원칙: brief의 verified 주장만 사용. unverified 항목(V-01 Jackson 자동구성, V-02 ThemeResolver 제거시점,
#        S1-3/S1-4/S6-2/S7-1)은 개념·관계에 넣지 않음. ThemeResolver는 scope_boundaries에서 "다루지 않음"으로만 처리.
# 버전 정합: Spring Boot 3.4.x → Spring Framework 6.2.x. 인용 페이지는 현행판(6.0 이후 구조 동일).

concept_model:

  # ── 개념 목록 (각 개념 = 구조도 노드) ─────────────────────────────
  concepts:

    - id: http-client
      name: HTTP 클라이언트
      definition: HTTP 요청을 보내고 응답을 수신하는 주체(브라우저/앱 등). 처리 흐름의 시작점이자 종점.
      source: "Spring Framework Reference — DispatcherServlet (central Servlet이 요청을 수신하는 구조 전제). brief S-01/S-16"

    - id: servlet-container
      name: 서블릿 컨테이너 (Tomcat)
      definition: HTTP 요청을 먼저 수신하여 등록된 서블릿(DispatcherServlet)으로 전달하고, 완성된 응답을 클라이언트로 되돌리는 실행 환경.
      source: "Jakarta Servlet 스펙(컨테이너 일반 동작) + Spring Framework Reference — DispatcherServlet('a central Servlet'). brief S-01/S-02/S-16"

    - id: front-controller-pattern
      name: 프론트 컨트롤러 패턴
      definition: 모든 요청을 단일 핸들러 객체로 통과시켜 공통 처리를 한곳에 통합하고, 요청별 고유 동작은 위임 컴포넌트로 분배하는 엔터프라이즈 웹 설계 패턴.
      source: "Martin Fowler, PoEAA — Front Controller('consolidates all request handling by channeling requests through a single handler object'). brief C-01/C-02/C-04/C-16"

    - id: dispatcher-servlet
      name: DispatcherServlet
      definition: 프론트 컨트롤러 패턴을 구현한 중앙 서블릿. 요청 처리의 공통 알고리즘을 제공하고, Spring 설정으로 발견한 위임 컴포넌트에 실제 작업을 분배한다.
      source: "Spring Framework Reference — DispatcherServlet('a central Servlet ... provides a shared algorithm ... uses Spring configuration to discover the delegate components'). brief C-01/C-05"

    - id: web-application-context
      name: WebApplicationContext
      definition: 웹 전용 스프링 애플리케이션 컨텍스트. DispatcherServlet이 처리 시작 시 request 속성으로 바인딩한다.
      source: "Spring Framework Reference — Processing(sequence) 1단계. brief S-03"

    - id: locale-resolver
      name: LocaleResolver
      definition: 클라이언트 Locale(및 시간대)을 해석해 국제화된 뷰를 제공하는 위임 컴포넌트. DispatcherServlet이 request에 바인딩(로케일 해석이 불필요하면 생략 가능).
      source: "Spring Framework Reference — Special Bean Types(LocaleResolver) + Processing 2단계. brief C-10/S-04/C-18"

    - id: multipart-resolver
      name: MultipartResolver
      definition: multipart 요청(예 파일 업로드)을 파싱하는 추상화. 설정된 경우에만 요청의 multipart 여부를 검사하고 래핑한다.
      source: "Spring Framework Reference — Special Bean Types(MultipartResolver) + Processing 3단계. brief C-11/S-05"

    - id: handler-mapping
      name: HandlerMapping
      definition: 요청을 핸들러 및 전/후처리 인터셉터 목록에 매핑하는 전략. 매핑 기준은 구현체마다 다르다.
      source: "Spring Framework Reference — Special Bean Types('Map a request to a handler along with a list of interceptors'). brief C-06/S-06"

    - id: handler-adapter
      name: HandlerAdapter
      definition: 핸들러가 실제로 어떻게 호출되는지와 무관하게 DispatcherServlet이 핸들러를 호출하도록 돕는 전략. 애노테이션 컨트롤러의 애노테이션 해석을 담당하여 DispatcherServlet을 세부로부터 차단한다.
      source: "Spring Framework Reference — Special Bean Types('shield the DispatcherServlet from such details'). brief C-07/S-07"

    - id: handler-interceptor
      name: HandlerInterceptor
      definition: 핸들러 실행 체인의 전/후 훅. preHandle(핸들러 호출 전, false 반환 시 체인 중단), postHandle(핸들러 실행 후), afterCompletion(요청 완료 후)의 세 시점을 가진다.
      source: "Spring Framework Reference — Interception(HandlerInterceptor). brief S-08/S-11/S-14"

    - id: controller
      name: Controller (@Controller / @RestController)
      definition: HTTP와 애플리케이션 로직 사이의 어댑터. 요청 매핑·입력 바인딩·형식 검증 트리거·응답/상태코드 생성을 담당하고, 유스케이스는 Service에 위임한다.
      source: "Spring Framework Reference — Annotated Controllers + Validation. brief L03 claim S4-1/S4-2/S5-1"

    - id: dto
      name: DTO (Data Transfer Object)
      definition: 프로세스 경계를 넘어 데이터를 운반하는 객체. Controller가 요청 입력을 바인딩·변환하는 대상이며, 도메인/영속 엔티티와 역할이 다르다.
      source: "Martin Fowler, PoEAA — Data Transfer Object('carries data between processes'). brief L03 claim S6-2"

    - id: service
      name: Service (서비스 계층)
      definition: 애플리케이션의 유스케이스(가용 오퍼레이션 집합)를 정의하고 업무 로직을 캡슐화하며, 트랜잭션을 제어하고 응답을 조율하는 계층.
      source: "Martin Fowler, PoEAA — Service Layer('encapsulates the application's business logic, controlling transactions and coordinating responses'). brief L03 claim S4-3"

    - id: transaction-boundary
      name: 트랜잭션 경계 (@Transactional)
      definition: 유스케이스 단위의 all-or-nothing 실행 경계. Spring 팀은 인터페이스/컨트롤러가 아니라 구체 서비스 클래스 메서드에 @Transactional을 붙일 것을 권장한다.
      source: "Spring Framework Reference — Using @Transactional('annotate methods of concrete classes ... rather than ... interfaces'). brief L03 claim S4-4"

    - id: repository
      name: Repository
      definition: 영속성 접근을 담당하는 컴포넌트. Service가 조율하는 대상이다. (내부 구현·JPA/DB 상세는 이 강의 범위 밖 — 경계 노드로만 등장.)
      source: "Martin Fowler, PoEAA — Service Layer(coordinating responses) 조율 대상. brief L03 claim S5-1"

    - id: http-message-converter
      name: HttpMessageConverter
      definition: 요청/응답 본문을 객체와 상호 변환하는 전략. @RequestBody 인자를 역직렬화하고, @ResponseBody 반환값을 응답 본문으로 직렬화한다.
      source: "Spring Framework Reference — HTTP Message Conversion + @ResponseBody('serialized to the response body through an HttpMessageConverter'). brief S-09/S-10"

    - id: view-resolver
      name: ViewResolver
      definition: 핸들러가 반환한 논리적 String 뷰 이름을 실제 View로 해석하는 전략.
      source: "Spring Framework Reference — Special Bean Types('Resolve logical String-based view names ... to an actual View'). brief C-09/S-12"

    - id: view
      name: View
      definition: 모델을 응답으로 렌더링하는 컴포넌트. ViewResolver가 해석한 실제 뷰.
      source: "Spring Framework Reference — Special Bean Types(ViewResolver 정의의 View) + Processing 5단계. brief C-09/S-12"

    - id: handler-exception-resolver
      name: HandlerExceptionResolver
      definition: 처리 중 발생한 예외를 해석하는 전략. 핸들러/HTML 에러 뷰/기타 대상으로 매핑할 수 있다.
      source: "Spring Framework Reference — Special Bean Types('Strategy to resolve exceptions'). brief C-08/S-15"

  # ── 관계 (요청 처리 흐름의 방향 = 구조도 화살표) ───────────────────
  # kind는 방향 있는 관계. branch A = @ResponseBody 경로, branch B = 뷰 렌더링 경로.
  relationships:

    # 요청 진입
    - from: http-client
      to: servlet-container
      kind: sends_request
      note: 클라이언트 HTTP 요청을 서블릿 컨테이너가 먼저 수신. (S-01)
    - from: servlet-container
      to: dispatcher-servlet
      kind: routes_to_front_controller
      note: 프론트 컨트롤러로 등록된 단일 서블릿으로 라우팅. (S-02)
    - from: dispatcher-servlet
      to: front-controller-pattern
      kind: implements
      note: DispatcherServlet은 프론트 컨트롤러 패턴의 구현체. (C-01/C-04)

    # DispatcherServlet 초기 바인딩 (선택 단계 포함)
    - from: dispatcher-servlet
      to: web-application-context
      kind: binds_to_request
      note: 처리 시작 시 request 속성으로 바인딩. (S-03)
    - from: dispatcher-servlet
      to: locale-resolver
      kind: binds_to_request
      optional: true
      note: 로케일 해석용. 불필요하면 생략 가능. (S-04/C-18)
    - from: dispatcher-servlet
      to: multipart-resolver
      kind: inspects_multipart
      optional: true
      note: 설정된 경우에만 multipart 검사·래핑. (S-05/C-18)

    # 핸들러 탐색 및 어댑터 선택
    - from: dispatcher-servlet
      to: handler-mapping
      kind: discovers_handler_chain
      note: 요청에 맞는 핸들러 + 인터셉터 실행 체인 탐색. (S-06)
    - from: handler-mapping
      to: handler-interceptor
      kind: supplies_interceptor_chain
      note: 핸들러와 함께 전/후처리 인터셉터 목록을 제공. (C-06/S-06)
    - from: dispatcher-servlet
      to: handler-adapter
      kind: selects
      note: 찾은 핸들러 호출을 위해 알맞은 HandlerAdapter 선택. (S-07)

    # 핸들러 호출 (preHandle 은 컨트롤러 호출 직전)
    - from: handler-interceptor
      to: controller
      kind: pre_handles
      timing: before_controller
      note: preHandle이 컨트롤러 호출 전에 실행. false 반환 시 체인 중단, 컨트롤러 미호출. (S-08)
    - from: handler-adapter
      to: controller
      kind: invokes
      note: HandlerAdapter가 실제 컨트롤러 메서드를 호출. (S-07/S-09)

    # 컨트롤러 → 서비스 배턴 (책임 경계 — L03)
    - from: controller
      to: http-message-converter
      kind: deserializes_request_body
      note: "@RequestBody 인자를 HttpMessageConverter로 역직렬화. (S-09)"
    - from: controller
      to: dto
      kind: binds_request_input
      note: 요청 입력을 파싱/바인딩하여 입력 DTO로 변환. (L03 S5-1/S6-2)
    - from: controller
      to: service
      kind: delegates_use_case
      note: 유스케이스 메서드 호출(입력 DTO 전달), 여기서 트랜잭션 시작. (L03 S5-1)
    - from: service
      to: transaction-boundary
      kind: owns
      note: 트랜잭션 경계 = 유스케이스(서비스) 경계. @Transactional은 서비스 구체 클래스 메서드에. (L03 S4-4)
    - from: service
      to: repository
      kind: coordinates
      note: 도메인/리포지토리를 조율하여 결과 산출. Repository 내부는 범위 밖. (L03 S5-1)
    - from: service
      to: controller
      kind: returns_result
      note: 처리 결과를 컨트롤러로 반환. (L03 S5-1)

    # 응답 분기 A — @ResponseBody / @RestController
    - from: controller
      to: http-message-converter
      kind: serializes_response
      branch: A
      note: "@ResponseBody 반환값을 HttpMessageConverter로 응답 본문 직렬화. 이 경로는 ViewResolver 미개입. (S-10)"
    - from: http-message-converter
      to: handler-adapter
      kind: response_committed_within
      branch: A
      timing: before_postHandle
      note: 분기 A에서 응답은 HandlerAdapter 내부에서 이미 기록·커밋되며 postHandle 이전이다 → postHandle에서 헤더 추가 등 응답 변경 불가. (S-11, brief 주의점)

    # 응답 분기 B — 뷰 렌더링
    - from: controller
      to: view-resolver
      kind: returns_view_name
      branch: B
      note: 논리적 String 뷰 이름/모델 반환. (S-12)
    - from: view-resolver
      to: view
      kind: resolves_to
      branch: B
      note: String 뷰 이름을 실제 View로 해석. 모델 미반환 시 렌더링 없음. (S-12/S-13)
    - from: view
      to: dispatcher-servlet
      kind: renders_to_response
      branch: B
      note: View가 모델을 응답으로 렌더링. (S-12)

    # 인터셉터 후처리 (분기 B에서 관측 — 타이밍 구분)
    - from: handler-interceptor
      to: controller
      kind: post_handles
      branch: B
      timing: after_controller_before_render
      note: postHandle은 핸들러 실행 후 호출. 분기 B(뷰) 경로에서 응답 변경 지점으로 유효. (S-14, 분기 A와 대비 S-11)
    - from: handler-interceptor
      to: controller
      kind: after_completion
      timing: after_request_complete
      note: afterCompletion은 요청 완료 후(양 분기 공통) 호출. (S-14)

    # 예외 경로
    - from: dispatcher-servlet
      to: handler-exception-resolver
      kind: resolves_exception
      note: 처리 중 발생 예외는 WebApplicationContext에 선언된 HandlerExceptionResolver 빈들이 해석. (S-15)

    # 응답 반환
    - from: dispatcher-servlet
      to: servlet-container
      kind: returns_response
      note: 완성된 응답을 서블릿 컨테이너로 반환. (S-16)
    - from: servlet-container
      to: http-client
      kind: returns_response
      note: 서블릿 컨테이너가 클라이언트로 HTTP 응답 반환. (S-16)

  # ── 범위 경계 (이 강의가 다루지 않는 것 — 시뮬레이터/슬라이드 범위 못박기) ──
  scope_boundaries:
    - "Servlet Filter 체인 (DispatcherServlet 앞단의 필터) — 다루지 않음. 흐름은 컨테이너→DispatcherServlet에서 시작."
    - "Spring Security (인증/인가, 시큐리티 필터 체인) — 다루지 않음."
    - "비동기 처리 (async, DeferredResult/Callable, WebFlux/리액티브) — 다루지 않음. 동기 서블릿 스택만 다룸."
    - "ThemeResolver / 테마 지원 — 현행 Special Bean Types에 없음(제거됨). DispatcherServlet이 사용한다고 언급하지 않음. (brief C-13)"
    - "JPA/DB·영속성 상세 (Repository 내부 구현, 트랜잭션 전파/격리 수준, 쿼리) — 다루지 않음. Repository는 경계 노드로만 등장."
    - "뷰 템플릿 엔진 상세 (Thymeleaf/JSP 등 렌더링 내부) — 다루지 않음. 분기 B는 ViewResolver→View 수준까지만."
    - "HttpMessageConverter의 구체 구현·JSON 자동구성 버전 특정 동작 (Jackson 자동구성 = Boot 3.x 기본값 여부) — brief V-01 unverified, 개념 모델에서 단정하지 않음."
    - "커스텀 HandlerMapping/HandlerAdapter 구현, content negotiation 상세, 파일 업로드 처리 상세 — 다루지 않음(존재만 언급)."
