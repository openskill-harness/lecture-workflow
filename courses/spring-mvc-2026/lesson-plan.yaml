# Lesson Plan — G2 재확정 승인 (2026-07-05, v1.7 레슨 재편 + 개념 모델·구조도 함께 승인)
# 이전 G2 승인 구조(4레슨, SIMULATION 포함)를 v1.7 규칙으로 재편: 시뮬레이터는 L01의 파트로 흡수
# 구→신 매핑: 구L01+구L02 → L01 / 구L03 → L02 / 구L04 → L03
# course: spring-mvc-2026 (촬영강의 2편: 편1=30분 L01~L02, 편2=20분 L03)
# 학습 목표 인덱스 (manifest.learning_goals):
#   0 = HTTP 요청이 Spring MVC 내부에서 처리되는 흐름을 설명할 수 있다.
#   1 = Controller와 Service의 책임을 구분할 수 있다.
#   2 = 기본적인 Controller를 구현할 수 있다.
# duration_minutes 합계 = 41 (total 50 이내. 편1: 24/30, 편2: 17/20 — 여유는 인트로/전환/아웃트로)

lessons:
  - id: L01
    title: Spring MVC는 요청을 왜 DispatcherServlet에 몰아주는가 — 흐름 추적까지
    lesson_mode: THEORY
    episode: 1
    duration_minutes: 14         # 파트: 이론 4분 + 시뮬 조작 10분 (원고에 명시)
    required_artifacts: [script, prompter_script, slides, simulator]
    learning_goal_refs: [0]

  - id: L02
    title: Controller와 Service의 책임 경계
    lesson_mode: THEORY
    episode: 1
    duration_minutes: 10
    required_artifacts: [script, prompter_script, slides]
    learning_goal_refs: [1]

  - id: L03
    title: 기본 Controller 구현 — 요청 매핑부터 응답까지
    lesson_mode: LAB
    episode: 2
    duration_minutes: 17
    required_artifacts: [step_code, validation_log, script, prompter_script, slides]
    learning_goal_refs: [2, 1]
