# Lesson Plan — G2 승인 완료 (2026-07-05) + G6 시점 L03 required 정정으로 G2 재확정 (사용자 승인)
# course: spring-mvc-offline-2026 (offline, 180분 현장 실습 수업, slide_mode: summary)
# 생성: lesson-classifier-agent (2026-07-05)
# 근거: manifest.yaml(G1 승인), _workspace/01_concept_model.yaml(재사용 개념 모델),
#        offline-lecture/pipeline.md(required_artifacts 기준), lecture-harness/schemas.md 2절(v1.7)
# 시간 계약: duration_minutes 합계 160 ≤ 180. 휴식 10분 × 2회(20분)는 레슨 duration 밖 여유.
# 시뮬레이터는 레슨이 아니라 L01의 파트(required_artifacts.simulator + 원고 시뮬 파트).

lessons:
  - id: L01
    title: Spring MVC 요청 처리 흐름 — DispatcherServlet 중심
    lesson_mode: THEORY
    duration_minutes: 45          # 판서 이론 ~28 + 시뮬 파트 ~17 (원고에 [SIM 실행]~[SIM 종료] 명시)
    required_artifacts: [slides, script, simulator, runbook]
    learning_goal_refs: [0]
    # 판서슬라이드(summary)로 클라이언트→컨테이너→DispatcherServlet→위임 컴포넌트 흐름을 짚고,
    # 재사용 시뮬레이터(offline_interactive)로 학생이 요청 흐름을 직접 눌러 확인.
    # scope_boundaries 준수: Filter/Security/async/ThemeResolver/JPA 상세 제외.
    simulator_reuse: spring-mvc-2026 요청 흐름 시뮬레이터 재사용 후보 (offline_interactive 프로파일 적합성 후속 검증)

  - id: L02
    title: Controller와 Service의 책임 경계
    lesson_mode: THEORY
    duration_minutes: 30          # 판서 이론 중심. 반입 코드 final/ 상태를 read-only로 관찰(빌드 없음)
    required_artifacts: [slides, script, runbook]
    learning_goal_refs: [1]
    # 책임 "구분"은 이해 목표 → THEORY. 반입된 stepped 코드의 최종 상태를 화면으로 관찰만 하고
    # 직접 구현은 L03에서 수행(동일 자산 이중 생산 방지). DTO·트랜잭션 경계는 개념 모델 범위까지만.

  - id: L03
    title: 기본 Controller 직접 구현·실행 (LAB)
    lesson_mode: LAB
    duration_minutes: 85          # 학생 실습 시간 반영 — 이론 레슨 대비 약 1.9배 (타이핑·실행·디버깅 여유)
    required_artifacts: [step_code, validation_log, lab_guide, problem_sheet, rubric, runbook]
    learning_goal_refs: [2]
    # 반입된 L04 stepped 코드(verify_only)가 실습 백본: starter→step→final을 학생이 따라 구현하고 실행.
    # G6 정정 (2026-07-05, 사용자 승인): script·slides 제거 — 오프라인 LAB의 도입·진행은 실습 가이드(흐름 지도)
    # + 진행 노트가 담당 (offline pipeline v1.9.1 문언 확정과 정합). rubric은 정답 코드(final/)와 대조.
    code_reuse: courses/spring-mvc-2026/code/L04 (stepped, verify_only) — 이 강의 폴더로 복사 후 검증·메타만, 단계 구조 유지

# 학습 목표 커버리지: goal[0]→L01, goal[1]→L02, goal[2]→L03 (모든 목표 1개 이상 레슨 연결, 미연결 레슨 없음)
# required_outputs 커버리지: slides(L01/L02 — L03은 가이드·진행노트가 담당, G6 정정), lab_guide/problem_sheet/rubric(L03),
#                            simulator(L01), source_code=step_code(L03, 반입), runbook(전 레슨, Phase 4 생성)
