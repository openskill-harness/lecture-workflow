# LAB 구조 — L03 (offline, LAB 85분) — G3 승인 대상
# course: spring-mvc-offline-2026 / lesson: L03 (learning_goal_refs: [2])
# 생성: script-agent (2026-07-05) — offline-lab-lesson-pipeline 2단계 산출물
# 백본 코드: courses/spring-mvc-2026/code/L04 (stepped, verify_only) — 이 강의 폴더로 복사됨(courses/spring-mvc-offline-2026/code/L03).
#   6개 디렉토리(00-starter~final) = 검증된 정답 스냅샷. 학생은 00-starter에서 시작해 5개 단계를 직접 타이핑해 재현한다.
# 시간 계약: duration_minutes 85 (lesson-plan.yaml L03). 단계 배분은 04_lab_L03_plan.md가 정본.

lab:
  id: LAB-L03
  title: 회원 가입 API를 요청 매핑부터 응답까지 직접 구현하기
  goal: |
    학생이 starter 프로젝트에서 시작해 MemberController와 MemberService만 직접 작성하여,
    "POST /members 요청이 도착 → DTO로 받고 → 가입 규칙 판단 → HTTP 상태로 응답"까지의
    한 흐름을 스스로 구현·실행한다. 도메인/저장소/DTO/빌드 설정은 starter에 미리 배치되어 있다.

  # ── 사전 배치(학생이 타이핑하지 않음) — 00-starter 스냅샷 ──────────────
  given:
    description: starter 프로젝트를 배부한다. 학생은 열어서 빌드·실행만 확인한다.
    prebuilt_files:
      - Member.java            # record 도메인
      - MemberRepository.java  # in-memory 저장소 (save / existsByEmail / findById)
      - SignUpRequest.java     # 요청 DTO
      - SignUpResponse.java    # 응답 DTO
      - build.gradle / settings.gradle / MemberApplication.java
    verify: 앱을 실행하고 POST /members 를 호출해 404 가 나오는 것을 확인한다(진입점이 아직 없음).
    teaching_point: 여기서부터 우리가 만드는 것은 MemberController와 MemberService 둘뿐이다.

  # ── 학생이 직접 타이핑할 단계 (starter→final 재현) ───────────────────
  learner_task:
    - step: 1
      ref_snapshot: 01-request-mapping
      title: 요청 매핑 — POST /members 를 컨트롤러 메서드에 연결
      types: MemberController.java (신규)
      does:
        - "@RestController 클래스 MemberController 를 만든다."
        - "@PostMapping(\"/members\") 메서드를 만들어 고정 문자열을 반환한다."
      run_check: POST /members 호출 시 200 과 고정 문자열이 응답된다(본문은 아직 무시).
      concept: 요청 매핑 = "이 URL·이 메서드가 오면 이 자바 메서드를 실행하라"는 선언. L01의 DispatcherServlet이 이 선언을 보고 핸들러를 찾는다.

    - step: 2
      ref_snapshot: 02-request-response-dto
      title: 요청/응답 데이터 흐름 — DTO 바인딩
      types: MemberController.java (수정)
      does:
        - "생성자 주입으로 MemberRepository 를 주입받는다."
        - "@RequestBody 로 JSON 본문을 SignUpRequest 로 받는다."
        - "저장 후 SignUpResponse DTO 로 응답한다(도메인 Member 를 그대로 반환하지 않는다)."
      run_check: '{"email","name"} JSON 을 보내면 저장되고 {"id","email"} 이 응답된다.'
      concept: 컨트롤러의 입구·출구는 도메인이 아니라 요청/응답 전용 DTO다 — 경계에서 데이터의 모양을 바꾼다.

    - step: 3
      ref_snapshot: 03-fat-controller
      title: 가입 규칙을 컨트롤러 안에 넣기 (의도적 fat controller)
      types: MemberController.java (수정)
      does:
        - "저장 전에 memberRepository.existsByEmail() 로 중복을 검사한다."
        - "중복이면 예외를 던진다(이 시점엔 IllegalStateException → 500)."
      run_check: 같은 이메일 두 번 가입 시 두 번째는 막힌다(단, 500 으로 나감 — 다음 단계에서 다듬음).
      concept: 지금 코드는 동작한다. 그러나 컨트롤러가 "요청 수신"과 "가입 규칙 판단"을 동시에 떠안았다 — L02에서 말한 책임 경계가 무너진 상태다.
      note: 이 단계는 의도적으로 "잘못된 상태"를 만든다. 다음 단계의 before로 존재한다.

    - step: 4
      ref_snapshot: 04-service-extracted
      title: 책임 분리 — 가입 규칙을 MemberService로 옮기기
      types: MemberService.java (신규) + MemberController.java (수정)
      does:
        - "@Service MemberService 를 만들고 중복 검사 + 저장 로직을 그대로 옮긴다."
        - "컨트롤러는 MemberService 를 주입받아 요청 수신·응답 변환만 한다."
        - "컨트롤러가 더 이상 MemberRepository 를 직접 알지 않는다."
      run_check: 동작은 step-3 과 동일. 코드의 책임 분포만 달라졌다.
      concept: 분리는 파일을 늘리는 게 아니라 변경 이유를 나누는 것이다 — 웹 형식이 바뀌면 Controller만, 가입 규칙이 바뀌면 Service만 고친다.

    - step: 5
      ref_snapshot: final
      title: 응답까지 완성 — 성공 201 Created, 중복 409 Conflict
      types: DuplicateEmailException.java (신규) + MemberService.java (수정) + MemberController.java (수정)
      does:
        - "DuplicateEmailException(RuntimeException) 을 만든다."
        - "서비스가 중복 시 IllegalStateException 대신 DuplicateEmailException 을 던진다."
        - "컨트롤러가 성공을 ResponseEntity 201 로, @ExceptionHandler 로 중복을 409 로 매핑한다."
      run_check: 신규 가입 → 201 + 응답 DTO / 중복 가입 → 409.
      concept: "응답까지"의 마지막 조각은 상태 코드다 — 응답은 데이터만이 아니라 결과의 의미를 담는다.

  # ── 강사 순회 확인 항목 (→ runbook instructor_checkpoint 원천) ─────────
  instructor_checkpoint:
    - stage: 2
      check: DTO/Entity(도메인) 혼용 — SignUpRequest/Response 대신 Member 를 입출력에 그대로 쓰는지.
      symptom: 응답에 name 까지 노출되거나, 요청을 Member 로 받아 id 를 클라이언트가 넣게 됨.
    - stage: 2
      check: 생성자 주입 누락 — memberRepository 필드만 선언하고 생성자를 안 만들어 NPE.
      symptom: 실행 시 NullPointerException, 또는 필드에 new 로 직접 생성.
    - stage: 2
      check: "@RequestBody 누락 — 어노테이션 없이 파라미터만 선언해 필드가 전부 null."
      symptom: 저장은 되는데 email/name 이 null 로 들어감.
    - stage: 3
      check: "\"동작하는데 왜 나눠요?\" 질문 — fat controller 를 문제로 인식하는지."
      response: 지금 나누라는 게 아니라, 다음 단계에서 나눌 "이유"를 지금 몸으로 느끼게 한다. 변경 이유가 섞였다는 점만 짚는다.
    - stage: 4
      check: 컨트롤러 비대 잔존 — Service 를 만들고도 컨트롤러가 Repository 를 계속 직접 참조.
      symptom: MemberController 에 여전히 existsByEmail 호출이 남아 있음.
    - stage: 4
      check: 로직 이동이 아니라 복제 — 컨트롤러에서 지우지 않고 서비스에 복붙해 이중 검사.
    - stage: 5
      check: 예외 타입 불일치 — 서비스가 IllegalStateException 을 그대로 던져 @ExceptionHandler(DuplicateEmailException) 가 매칭 안 됨.
      symptom: 중복 시 여전히 500. (409 로 안 바뀜)
    - stage: 5
      check: import/상태코드 혼동 — HttpStatus.CREATED(201)/CONFLICT(409) import 누락, ResponseEntity 미사용.

  # ── 제출물 ───────────────────────────────────────────────────────────
  submission:
    - kind: 실행 화면
      detail: 신규 가입 201 응답 + 동일 이메일 재요청 409 응답 2건(HTTP 클라이언트/터미널 캡처).
    - kind: 코드
      detail: 완성된 MemberController / MemberService / DuplicateEmailException (GitHub repo 또는 zip).
    method: 현장에서는 강사 순회 확인이 1차 채점, 제출은 수업 후 업로드로 마감.

  evaluation:
    rubric_id: RUBRIC-L03

  # ── 힌트 수위 (G3 결정 항목 — 04_plan.md에 3안 상세, B안 권장) ──────────
  hint_level:
    proposed_default: B
    note: 문제지(problem_sheet)의 단계별 힌트 밀도. A=목표만 / B=목표+핵심 어노테이션·클래스명+흔한 오류 경고 / C=골격코드 빈칸채우기. 대상 학습자(Spring Boot CRUD 경험 보유)에 B 적합.
