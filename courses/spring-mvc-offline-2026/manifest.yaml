# Course Manifest — G1 승인 완료 (2026-07-05, slide_mode: summary 확정) / offline 라인 드라이런
course:
  id: spring-mvc-offline-2026
  title: Spring MVC와 웹 요청 처리 구조 — 오프라인 실습 수업
  delivery_type: offline

target_learners:
  - Java 문법 가능
  - Spring Boot로 CRUD API를 만들어 본 경험 있음
  - Servlet 컨테이너와 DispatcherServlet 내부 구조는 모름

duration:
  total_minutes: 180       # 현장 수업 1회 (3시간) — 이론+실습 운영. 오프라인은 편 개념 없음

existing_assets:           # v1.5 반입 경로 실증 — 촬영강의에서 만든 검증된 자산 재사용
  - kind: source_code
    path: courses/spring-mvc-2026/code/L04
    shape: stepped         # 이미 단계별 (00-starter ~ final, step.yaml + validation_log 보유)
    access: read_only      # 원본 무수정 — 이 강의 폴더로 복사 후 사용
    policy: verify_only    # 단계 구조 유지, 검증·메타만 (stepped+verify_only — 매트릭스 유효 조합)

tech_stack:
  - Java 21
  - Spring Boot 3.4.x
  - Gradle 8.x
  - IntelliJ IDEA

learning_goals:
  - HTTP 요청이 Spring MVC 내부에서 처리되는 흐름을 설명할 수 있다.
  - Controller와 Service의 책임을 구분할 수 있다.
  - 기본적인 Controller를 직접 구현하고 실행해 볼 수 있다.   # 오프라인: 학생이 직접 실습

required_outputs:
  - slides
  - lab_guide
  - problem_sheet
  - rubric
  - runbook
  - simulator
  - source_code

style:
  tone: 실무형, 초급자 친화적
  visual_style: 깔끔한 기술 교육용 (라이트 테마)
  language: ko-KR
  slide_mode: summary      # G1 결정 필요 (v1.7): summary(판서용) | rich(고밀도) — 초안은 판서 수업 가정

constraints:
  max_slide_words: 45      # rich 선택 시에만 의미. summary면 판서슬라이드 규칙(컷당 한 줄)이 우선
  code_font_min_pt: 22
  citation_required_for: [statistics, news, version_specific_claims, external_case_studies]
