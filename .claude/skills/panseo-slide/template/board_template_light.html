<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{{DECK_TITLE}}</title>
<!--
  board_template_light.html — 라이트 테마 판서 엔진 (panseo-slide 스킬 소유). 요약·그대로 두 모드 공용 유일 템플릿.
  라이트 테마 — 밝은 배경 슬라이드에 맞춰 <style> 색 토큰만 라이트로, <script>는 무수정.
  ★ <script> 블록 무수정 — 펜/판서모드(b)/모눈(g)/도형스냅(s)/선택(✂)·이동(✋)/지우개/전체화면(⛶)/←→ 네비 로직은
     원본과 바이트 동일. color/background/border-color/box-shadow 색상값만 라이트로 반전(레이아웃·크기·position 불변).
  ★ 판서모드 칠판은 초록 유지(판서 가독성). 흰색 펜 기본값은 JS 하드코딩(color='#ffffff')이라 미변경 —
     라이트 슬라이드에 직접 판서 시 흰 펜은 저대비 → 판서모드(초록칠판) 사용 또는 다른 스와치 색 선택 권장.
  재동기화: 원본 엔진 개정 시 <script>…</script> 블록을 원본에서 그대로 재복사하고 <style> 색 토큰만 다시 반전.
-->
<!--
  판서슬라이드 엔진 (고정) — 위쪽 스타일과 아래쪽 스크립트는 건드리지 말 것.
  강의별로 바꾸는 곳은 STEPS START ~ STEPS END 사이의 .step 섹션과 :root 강조색뿐.
-->
<style>
  :root{
    --bg:#f7f8fa; --board:#ffffff; --ink:#1a1f2e; --dim:#5b6b82;
    --line:#e2e6ee; --accent:#0a6fbd; --warn:#d21f3c; --gold:#a86e00; --green:#0b8a55;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink); touch-action:none; overscroll-behavior:none;}
  #stage{position:fixed; inset:0;}

  /* ── 콘텐츠 레이어 (판서 뒤) ── */
  #content{position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(1200px 700px at 50% -10%, #ffffff 0%, var(--board) 55%, var(--bg) 100%);}
  #content::before{content:""; position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:46px 46px; -webkit-mask:radial-gradient(circle at 50% 40%,#000,transparent 85%);
            mask:radial-gradient(circle at 50% 40%,#000,transparent 85%);}
  .step{position:absolute; inset:0; display:none; padding:6vh 7vw;
    flex-direction:column; align-items:flex-start; justify-content:center;}
  .step.active{display:flex; animation:fade .5s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .kicker{font-size:clamp(13px,1.8vw,20px); letter-spacing:.35em; color:var(--accent);
    text-transform:uppercase; margin-bottom:2.2vh; font-weight:700;}
  h1{font-size:clamp(30px,6vw,76px); line-height:1.18; margin:0; font-weight:800; letter-spacing:-.01em;}
  .sub{margin-top:3vh; font-size:clamp(16px,2.4vw,30px); color:var(--dim); font-weight:500;}
  .hl{color:var(--gold);} .hlb{color:var(--accent);} .hlr{color:var(--warn);} .hlg{color:var(--green);}

  /* ── 재사용 컴포넌트 (reference/components.md 참고) ── */
  /* 썸네일 피드 */
  .feed{display:flex; gap:1.4vw; margin-top:4vh; flex-wrap:wrap;}
  .thumb{width:clamp(150px,17vw,230px); height:clamp(86px,10vw,130px); border-radius:12px;
    background:linear-gradient(135deg,#eef1f6,#e2e7f0); border:1px solid #d3dae6;
    position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:10px;
    font-size:clamp(11px,1.2vw,15px); font-weight:700; color:#2a3346;}
  .thumb b{color:var(--warn);}
  .thumb::after{content:"▶"; position:absolute; top:8px; right:10px; color:#d21f3c; font-size:14px;}
  /* 가로 게이지 */
  .gauges{margin-top:5vh; width:min(560px,80vw);}
  .grow{display:flex; align-items:center; gap:14px; margin:14px 0;}
  .glabel{width:120px; font-size:clamp(14px,1.7vw,20px); color:var(--dim);}
  .gbar{flex:1; height:18px; border-radius:10px; background:#e6eaf1; overflow:hidden; border:1px solid #d3dae6;}
  .gfill{height:100%;}
  /* 번호 리스트(약속) */
  .promise{margin-top:4vh; display:flex; flex-direction:column; gap:1.8vh;}
  .promise .p{display:flex; align-items:baseline; gap:16px; font-size:clamp(17px,2.4vw,30px); font-weight:700;}
  .promise .n{color:var(--accent); font-variant-numeric:tabular-nums;}
  .promise .x{color:var(--dim); font-weight:500; font-size:.7em;}

  /* ── 칠판 (판서모드) ── */
  #board{position:absolute; inset:0; z-index:1; display:none;
    background:radial-gradient(1400px 850px at 50% 0%, #1a4a40 0%, #103029 58%, #0b241f 100%);
    box-shadow:inset 0 0 0 14px #5a3d24, inset 0 0 0 16px #3a2614, inset 0 0 120px rgba(0,0,0,.5);}
  #board.show{display:block;}
  #board::after{content:"판서모드"; position:absolute; top:24px; left:50%; transform:translateX(-50%);
    font-size:13px; letter-spacing:.4em; color:rgba(255,255,255,.18); font-weight:700;}
  /* ── 모눈종이 격자(판서모드용) ── */
  #board.grid{
    background:
      linear-gradient(rgba(255,255,255,.10) 1px, transparent 1px) 0 0/46px 46px,
      linear-gradient(90deg, rgba(255,255,255,.10) 1px, transparent 1px) 0 0/46px 46px,
      radial-gradient(1400px 850px at 50% 0%, #1a4a40 0%, #103029 58%, #0b241f 100%);}

  /* ── 판서 캔버스 ── */
  #pad{position:absolute; inset:0; z-index:2; touch-action:none; cursor:crosshair;}

  /* ── 툴바 ── */
  #tools{position:absolute; z-index:3; left:50%; bottom:18px; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:16px;
    flex-wrap:nowrap; max-width:96vw; overflow-x:auto;
    background:rgba(255,255,255,.86); border:1px solid #d3dae6; backdrop-filter:blur(8px);
    box-shadow:0 8px 30px rgba(30,41,59,.18);}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid #cbd3e0;cursor:pointer;}
  .swatch.sel{border-color:#1a1f2e; transform:scale(1.12);}
  .btn{height:34px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid #cbd3e0;
    background:#eef1f6;color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;display:flex;
    align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex-shrink:0;}
  .btn:active{background:#e0e5ee;}
  .btn.on{background:var(--accent);color:#ffffff;border-color:var(--accent);}
  .sep{width:1px;height:28px;background:#cbd3e0;margin:0 2px;}
  .sizes{display:flex;gap:6px;align-items:center;}
  .sz{width:26px;height:26px;border-radius:50%;border:1px solid #cbd3e0;background:#eef1f6;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .sz i{display:block;border-radius:50%;background:var(--ink);}
  .sz.sel{border-color:var(--accent);}

  /* ── 네비게이션 ── */
  .nav{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:54px;height:54px;
    border-radius:50%;border:1px solid #d3dae6;background:rgba(255,255,255,.82);color:var(--ink);
    font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #prev{left:14px;} #next{right:14px;}
  #dots{position:absolute;z-index:3;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:9px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#cbd3e0;}
  .dot.on{background:var(--accent);width:24px;border-radius:5px;}
  #idx{position:absolute;z-index:3;top:14px;right:18px;font-size:13px;color:var(--dim);font-weight:700;}
  .hint{position:absolute;z-index:3;bottom:64px;left:50%;transform:translateX(-50%);
    font-size:12px;color:#6b7688;letter-spacing:.05em;}

  /* ── 전체화면 토글 (좌상단, 태블릿용) ── */
  #fsBtn{position:absolute;z-index:4;top:12px;left:14px;width:40px;height:40px;border-radius:10px;
    border:1px solid #d3dae6;background:rgba(255,255,255,.82);color:var(--ink);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  #fsBtn:active{background:#e0e5ee;}
</style>
</head>
<body>
<div id="stage">
  <div id="content">

  <!-- ===================== STEPS START ===================== -->
  <!-- 강의별로 이 영역만 교체. 첫 섹션에 class="step active", 나머지는 class="step".
       글자는 최소로 — 빈 공간은 판서로 채운다. 컴포넌트는 reference/components.md 참고. -->

    <section class="step active">
      <div class="kicker">{{KICKER}}</div>
      <h1>여기에 <span class="hlb">한 줄짜리</span> 큰 메시지</h1>
      <div class="sub">보조 한 줄 — <span class="hl">핵심 단어만 강조</span></div>
    </section>

    <section class="step">
      <div class="kicker">두 번째 컷</div>
      <h1>슬라이드는 뼈대만,<br>나머지는 <span class="hlr">판서로</span>.</h1>
    </section>

    <section class="step">
      <div class="kicker">마지막 컷</div>
      <h1>초대 / 다음 편 떡밥</h1>
      <div class="sub"><span class="hlb">다음 편 — …</span></div>
    </section>

  <!-- ===================== STEPS END ===================== -->

  </div>

  <div id="board"></div>
  <canvas id="pad"></canvas>

  <!-- UI -->
  <button id="fsBtn" title="전체화면 토글 (f)">⛶</button>
  <button class="btn" id="playBtn" title="녹화 판서 재생 — 클릭·→·Space로 한 구간씩, ←로 되돌리기 (p)" style="display:none;position:absolute;z-index:4;top:15px;left:64px;">▶ 재생</button>
  <div id="dots"></div>
  <div id="idx">1 / 1</div>
  <button class="nav" id="prev">‹</button>
  <button class="nav" id="next">›</button>

  <div id="tools">
    <button class="btn" id="boardBtn">🪧 판서모드</button>
    <button class="btn" id="gridBtn" title="모눈종이 격자 (g)">▦ 모눈</button>
    <button class="btn on" id="snapBtn" title="도형 스냅 켜기/끄기 (s)">◇ 도형</button>
    <div class="sep"></div>
    <div class="swatch sel" style="background:#ffffff" data-c="#ffffff"></div>
    <div class="swatch" style="background:#ffd25c" data-c="#ffd25c"></div>
    <div class="swatch" style="background:#5cc8ff" data-c="#5cc8ff"></div>
    <div class="swatch" style="background:#ff5c6e" data-c="#ff5c6e"></div>
    <div class="swatch" style="background:#54e3a0" data-c="#54e3a0"></div>
    <div class="swatch" style="background:#1a1f2e" data-c="#1a1f2e" title="검정 펜"></div>
    <div class="sep"></div>
    <div class="sizes">
      <div class="sz" data-s="2"><i style="width:5px;height:5px"></i></div>
      <div class="sz sel" data-s="4"><i style="width:9px;height:9px"></i></div>
      <div class="sz" data-s="8"><i style="width:15px;height:15px"></i></div>
    </div>
    <div class="sep"></div>
    <button class="btn" id="selBtn" title="선택 — 사각형으로 묶어 끌기">✂ 선택</button>
    <button class="btn" id="moveBtn" title="이동 — 그림을 눌러 이어진 부분을 끌어 옮기기">✋ 이동</button>
    <button class="btn" id="hlBtn" title="형광펜 — 반투명 굵은 마커">🖍 형광펜</button>
    <button class="btn" id="eraser">지우개</button>
    <button class="btn" id="undo">되돌리기</button>
    <button class="btn" id="clear">전체지움</button>
    <button class="btn" id="saveBtn" title="판서 저장 — .ink.json (k) · Shift+클릭 = InkML (Shift+K)">💾</button>
  </div>
</div>

<script>
/* ── 판서슬라이드 엔진 (고정) — 수정 금지 · v4: 도형스냅 + 큰 네모 지우개 + 선택삭제 + ◇도형/⛶전체화면 버튼 + 판서 녹화(💾 .ink.json/InkML)·클릭 재생(▶) ── */
(function(){
  const steps = Array.from(document.querySelectorAll('.step'));
  const total = steps.length;
  let cur = 0;
  const dots = document.getElementById('dots');
  steps.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');dots.appendChild(d);});
  const dotEls = Array.from(dots.children);
  const idxEl = document.getElementById('idx');
  idxEl.textContent = '1 / '+total;

  const pad = document.getElementById('pad');
  const ctx = pad.getContext('2d');
  let dpr = Math.max(1, window.devicePixelRatio||1);
  // 슬라이드/판서모드별 '획(stroke) 객체' 목록 — 손 안 떼고 그린 한 획 = 객체 하나
  const slideStrokes = Array.from({length: total}, ()=>[]);
  let boardStrokes = [];
  let strokes = slideStrokes[0];     // 현재 활성 레이어(배열 참조)
  const undoStack = [];               // 각 항목 = strokes 배열의 스냅샷(shallow copy)
  function setLayer(arr){ strokes = arr; if(boardMode) boardStrokes = arr; else slideStrokes[cur] = arr; }
  function snapshot(){ undoStack.push(strokes.slice()); if(undoStack.length>60) undoStack.shift(); }

  function fit(restore){
    dpr = Math.max(1, window.devicePixelRatio||1);
    pad.width = Math.floor(innerWidth*dpr); pad.height = Math.floor(innerHeight*dpr);
    pad.style.width = innerWidth+'px'; pad.style.height = innerHeight+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round'; ctx.lineJoin='round';
    if(restore) render();
  }
  fit(false);
  addEventListener('resize',()=>fit(true));

  function clearCanvas(){ctx.clearRect(0,0,innerWidth,innerHeight);}
  function lineW2(s,pr){ return Math.max(1, s.size*(0.45 + pr*1.1)); }
  function drawStroke(s,ox,oy){ ox=ox||0; oy=oy||0; const pts=s.pts; if(!pts.length) return;
    ctx.save();
    if(s.hl){                                              // 형광펜: 반투명 + 단일 path(이음새 이중겹침 방지) + 각진 끝
      ctx.globalAlpha=HL_ALPHA; ctx.strokeStyle=s.color; ctx.fillStyle=s.color; ctx.lineCap='butt'; ctx.lineJoin='round';
      const w=HL_W(s.size);
      if(pts.length===1){ ctx.beginPath(); ctx.arc(pts[0].x+ox,pts[0].y+oy,w/2,0,Math.PI*2); ctx.fill(); }
      else { ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(pts[0].x+ox,pts[0].y+oy); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x+ox,pts[i].y+oy); ctx.stroke(); }
      ctx.restore(); return;
    }
    ctx.globalCompositeOperation = s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color; ctx.fillStyle=s.color;
    if(pts.length===1){ const w=lineW2(s,pts[0].p); ctx.beginPath(); ctx.arc(pts[0].x+ox,pts[0].y+oy,(s.erase?w*2.4:w)/2,0,Math.PI*2); ctx.fill(); }
    else { for(let i=1;i<pts.length;i++){ const w=s.erase?lineW2(s,pts[i].p)*2.6:lineW2(s,pts[i].p);
      ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(pts[i-1].x+ox,pts[i-1].y+oy); ctx.lineTo(pts[i].x+ox,pts[i].y+oy); ctx.stroke(); } }
    ctx.restore();
  }
  function render(){ clearCanvas(); for(const s of strokes) drawStroke(s,0,0); }

  let drawing=false, color='#ffffff', size=4, erasing=false, last=null, curStroke=null;
  let highlighting=false;                                  // 형광펜(반투명 굵은 마커) 모드
  const HL_ALPHA=0.32; function HL_W(sz){ return Math.max(16, sz*4.5); }  // 형광펜 불투명도·굵기
  function effW(s){ return s.hl ? HL_W(s.size) : s.size; }               // 선택/이동 hit-test용 유효 폭
  let eraseGesture=false, erasePath=null;
  const ERS=72;                                            // 큰 네모 지우개 한 변(px)
  const ERASER_CURSOR="url(\"data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='72'%20height='72'%3E%3Crect%20x='2'%20y='2'%20width='68'%20height='68'%20fill='white'%20fill-opacity='0.12'%20stroke='white'%20stroke-width='2'/%3E%3C/svg%3E\") 36 36, crosshair";
  function pos(e){return {x:e.clientX, y:e.clientY, p:(e.pressure&&e.pressure>0)?e.pressure:0.5, t:(e.timeStamp>0?e.timeStamp:performance.now())};}
  function lineW(pressure){ return Math.max(1, size * (0.45 + pressure*1.1)); }

  /* ── 선택·이동: '획(stroke) 객체' 단위 (겹쳐도 따로 잡힘) ── */
  let selMode=false, moveMode=false, selecting=false, selStart=null, selBase=null;
  let floatStrokes=null, floatBB=null, floatDX=0, floatDY=0, floatBase=null, movingFloat=false, grab=null;
  const DASH='#5cc8ff';
  function getFull(){ return ctx.getImageData(0,0,pad.width,pad.height); }
  function dashedRect(x,y,w,h){ ctx.save(); ctx.setLineDash([7,5]); ctx.lineWidth=1.5; ctx.strokeStyle=DASH; ctx.strokeRect(x,y,w,h); ctx.restore(); }
  function bboxOf(arr){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const s of arr){ const m=effW(s)+4; for(const q of s.pts){ if(q.x-m<x0)x0=q.x-m; if(q.y-m<y0)y0=q.y-m; if(q.x+m>x1)x1=q.x+m; if(q.y+m>y1)y1=q.y+m; } } return {x:x0,y:y0,w:x1-x0,h:y1-y0}; }
  function distSeg(p,a,b){ const dx=b.x-a.x, dy=b.y-a.y, L=dx*dx+dy*dy; let t=L?((p.x-a.x)*dx+(p.y-a.y)*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy)); }
  function distStroke(p,s){ const pts=s.pts; if(pts.length===1) return Math.hypot(p.x-pts[0].x,p.y-pts[0].y); let m=1e9; for(let i=1;i<pts.length;i++) m=Math.min(m,distSeg(p,pts[i-1],pts[i])); return m; }
  function pickStroke(p){ for(let i=strokes.length-1;i>=0;i--){ const s=strokes[i]; if(s.erase) continue; const tol=12+(s.hl?HL_W(s.size)/2:s.size); if(distStroke(p,s)<=tol) return i; } return -1; }
  function strokeInRect(s,x,y,w,h){ for(const q of s.pts){ if(q.x>=x&&q.x<=x+w&&q.y>=y&&q.y<=y+h) return true; } return false; }
  function insideFloat(p){ return floatStrokes && p.x>=floatBB.x+floatDX && p.x<=floatBB.x+floatDX+floatBB.w && p.y>=floatBB.y+floatDY && p.y<=floatBB.y+floatDY+floatBB.h; }
  function redrawFloat(){ if(!floatStrokes) return; ctx.putImageData(floatBase,0,0); for(const s of floatStrokes) drawStroke(s,floatDX,floatDY); dashedRect(floatBB.x+floatDX,floatBB.y+floatDY,floatBB.w,floatBB.h); }

  /* ── 도형 스냅(draw-and-hold): 한 획을 그리고 손을 뗀 자리에서 ~0.6초 멈추면 깔끔한 도형으로 ── */

    const cn=realCorners(simp.slice(0,-1)), c=cn.length;

    if(c===3) return polyPts(cn,true);
    if(c===4 && eErr>0.16) return polyPts(rect,true);
    if(eErr<0.25) return ellipsePts(cx,cy,ra,rb);
    if(c===4) return polyPts(rect,true);
    return null;
  }
  /* ── 끊어 그린 도형: 가까이 이어진 여러 획을 한 점구름으로 합쳐 인식 ── */
  function ptsBox(pts){ let a=1e9,b=1e9,c=-1e9,d=-1e9; for(const q of pts){ if(q.x<a)a=q.x; if(q.y<b)b=q.y; if(q.x>c)c=q.x; if(q.y>d)d=q.y; } return {a:a,b:b,c:c,d:d}; }
  function boxNear(p,q,g){ return p.a<=q.c+g && q.a<=p.c+g && p.b<=q.d+g && q.b<=p.d+g; }
  function clusterFrom(seed){
    const GAP=28, idx=[]; for(let i=0;i<strokes.length;i++){ if(!strokes[i].erase && !strokes[i].hl) idx.push(i); }
    const box={}; for(const i of idx) box[i]=ptsBox(strokes[i].pts);
    const si=strokes.indexOf(seed); if(si<0) return [];
    const inSet=new Set([si]); const m={a:box[si].a,b:box[si].b,c:box[si].c,d:box[si].d};

        if(boxNear(m,box[i],GAP)){ inSet.add(i); m.a=Math.min(m.a,box[i].a); m.b=Math.min(m.b,box[i].b); m.c=Math.max(m.c,box[i].c); m.d=Math.max(m.d,box[i].d); grew=true; } } }

  function cloudRect(cloud){

    const tol=Math.max(12,0.12*diag); let maxd=0;

    if(cL<2||cR<2||cT<2||cB<2) return null;                  // 네 변의 '가운데'가 모두 채워져야 (ㄱ자 거부)

  function cloudEllipse(cloud){

  pad.addEventListener('pointerdown',e=>{
    if(e.button!==undefined && e.button>0) return;
    pad.setPointerCapture(e.pointerId); const p=pos(e);
    if(playMode){ e.preventDefault(); advance(); return; }
    if(floatStrokes){ if(insideFloat(p)){ movingFloat=true; grab={x:p.x-floatDX,y:p.y-floatDY}; pad.style.cursor='grabbing'; return; } commitFloat(); }

  pad.addEventListener('pointermove',e=>{

  pad.addEventListener('pointerup',e=>{

  function endStroke(){

  pad.addEventListener('pointerleave',endStroke);

  const selBtn=document.getElementById('selBtn');
  const moveBtn=document.getElementById('moveBtn');
  function clearModes(){ selMode=false; moveMode=false; selBtn.classList.remove('on'); moveBtn.classList.remove('on'); pad.style.cursor='crosshair'; }

  moveBtn.addEventListener('click',()=>{ commitFloat();

  function go(n){

    finishAnim(); strokes=slideStrokes[cur]; render(); onEnterLayer();
  }
  document.getElementById('prev').addEventListener('click',()=>go(cur-1));
  document.getElementById('next').addEventListener('click',()=>advance());
  // 도형 스냅 토글 버튼
  const snapBtn=document.getElementById('snapBtn');
  snapBtn.addEventListener('click',()=>{ snapEnabled=!snapEnabled; snapBtn.classList.toggle('on',snapEnabled); });
  // 전체화면 토글 (⛶) — 태블릿은 F11이 안 되고 사용자 탭에서만 허용되므로 작은 버튼에만 건다
  const fsBtn=document.getElementById('fsBtn');
  function toggleFs(){ const d=document.documentElement;
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);
    } else {
      (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
    } }
  fsBtn.addEventListener('click',toggleFs);

  /* ── 판서 녹화 · 저장 · 클릭 재생 (v4) ──
     모든 점은 {x,y,p,t}(t=ms)로 기록된다. 💾(k)로 현재 레이어를 .ink.json, Shift(+K)면 InkML로 내려받는다.
     <script type="application/json" class="ink-clip" data-slide="N" data-layer="slide|board"> 로 박아두거나
     파일을 화면에 끌어다 놓으면 그 슬라이드(또는 칠판)에 '클립'이 붙고, 클릭·→·Space마다
     손 멈춘 시간(pauseMs, 기본 1000ms)으로 나뉜 한 구간씩 실제 그린 속도로 다시 그려진다. ← = 한 구간 되돌리기. */
  const PAUSE_MS=1000, GAP_CAP=300;                        // 구간 경계(쉼) · 구간 안 획 사이 대기 상한
  const clips={};                                          // key 'slide:N' | 'board:N' (N=1부터)
  let playMode=false, anim=null;
  const playBtn=document.getElementById('playBtn'), saveBtn=document.getElementById('saveBtn');
  function clipKey(){ return (boardMode?'board:':'slide:')+(cur+1); }
  function curClip(){ return clips[clipKey()]||null; }
  function r1(v){ return Math.round(v*10)/10; }
  function inkData(){                                      // 현재 레이어 → panseo-ink JSON(시간순)
    commitFloat();
    const list=strokes.filter(s=>!s.erase&&s.pts.length); let fake=0;
    const items=list.map((s,i)=>{ const pts=s.pts.map(q=>{ if(q.t==null){ q.t=fake; fake+=12; } return q; }); return {s:s,t0:pts[0].t,i:i}; });
    items.sort((a,b)=>a.t0-b.t0||a.i-b.i);
    const base=items.length?items[0].t0:0;
    return {format:'panseo-ink',version:1,w:innerWidth,h:innerHeight,layer:boardMode?'board':'slide',slide:cur+1,pauseMs:PAUSE_MS,
      strokes:items.map(o=>({color:o.s.color,size:o.s.size,hl:!!o.s.hl,pts:o.s.pts.map(q=>[r1(q.x),r1(q.y),Math.round(q.p*100)/100,Math.round(q.t-base)])}))};
  }
  function xmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function toInkML(d){
    const brushes=[], bIdx={}, traces=[];
    for(const s of d.strokes){ const k=s.color+'|'+s.size+'|'+(s.hl?1:0);
      if(!(k in bIdx)){ bIdx[k]=brushes.length; brushes.push('    <brush xml:id="b'+brushes.length+'"><brushProperty name="color" value="'+xmlEsc(s.color)+'"/><brushProperty name="width" value="'+s.size+'" units="px"/>'+(s.hl?'<brushProperty name="transparency" value="0.68"/><brushProperty name="panseo-highlighter" value="true"/>':'')+'</brush>'); }
      traces.push('  <trace brushRef="#b'+bIdx[k]+'">'+s.pts.map(q=>q.join(' ')).join(', ')+'</trace>'); }
    const meta={w:d.w,h:d.h,layer:d.layer,slide:d.slide,pauseMs:d.pauseMs};
    return '<?xml version="1.0" encoding="UTF-8"?>\n<ink xmlns="http://www.w3.org/2003/InkML">\n  <definitions>\n'+
      '    <traceFormat xml:id="tf"><channel name="X" type="decimal"/><channel name="Y" type="decimal"/><channel name="F" type="decimal"/><channel name="T" type="integer" units="ms"/></traceFormat>\n'+
      brushes.join('\n')+'\n  </definitions>\n  <annotation type="panseo-ink">'+xmlEsc(JSON.stringify(meta))+'</annotation>\n'+traces.join('\n')+'\n</ink>\n';
  }
  function fromInkML(txt){                                 // InkML → panseo-ink (T 없으면 시간 합성)
    const doc=new DOMParser().parseFromString(txt,'application/xml'); if(doc.getElementsByTagName('parsererror').length) throw new Error('InkML 파싱 실패');
    const q=(el,n)=>Array.from(el.getElementsByTagNameNS('*',n));
    let order=['X','Y']; const tf=q(doc,'traceFormat')[0]; if(tf){ const ch=q(tf,'channel').map(c=>c.getAttribute('name')); if(ch.length) order=ch; }
    const brushes={}; for(const b of q(doc,'brush')){ const o={color:'#ffffff',size:4,hl:false};
      for(const p of q(b,'brushProperty')){ const n=p.getAttribute('name'), v=p.getAttribute('value');
        if(n==='color') o.color=v; else if(n==='width') o.size=+v||4; else if(n==='panseo-highlighter') o.hl=(v==='true'); }
      brushes[b.getAttribute('xml:id')||b.getAttribute('id')]=o; }
    let meta={}; for(const a of q(doc,'annotation')){ if(a.getAttribute('type')==='panseo-ink'){ try{ meta=JSON.parse(a.textContent); }catch(_){} } }
    const ix=order.indexOf('X'), iy=order.indexOf('Y'), ip=order.indexOf('F'), it=order.indexOf('T');
    let clock=0; const strokes=[];
    for(const tr of q(doc,'trace')){ const b=brushes[(tr.getAttribute('brushRef')||'').replace('#','')]||{color:'#ffffff',size:4,hl:false};
      const pts=tr.textContent.split(',').map(s=>s.trim().split(/\s+/).map(Number)).filter(a=>a.length>=2&&!isNaN(a[0]))
        .map(a=>{ const t=(it>=0&&!isNaN(a[it]))?a[it]:(clock+=12); return [a[ix<0?0:ix],a[iy<0?1:iy],ip>=0&&!isNaN(a[ip])?a[ip]:0.5,t]; });
      if(it<0) clock+=400;
      if(pts.length) strokes.push({color:b.color,size:b.size,hl:b.hl,pts:pts}); }
    let w=meta.w, h=meta.h; if(!w||!h){ let mx=0,my=0; for(const s of strokes) for(const p of s.pts){ if(p[0]>mx)mx=p[0]; if(p[1]>my)my=p[1]; } w=Math.max(mx+20,innerWidth); h=Math.max(my+20,innerHeight); }
    return {format:'panseo-ink',version:1,w:w,h:h,layer:meta.layer||'slide',slide:meta.slide||1,pauseMs:meta.pauseMs||PAUSE_MS,strokes:strokes};
  }
  function parseClip(txt){ txt=txt.trim(); return txt.charAt(0)==='<'?fromInkML(txt):JSON.parse(txt); }
  function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
  function baseName(){ const t=(document.title||'panseo').replace(/[\\/:*?"<>|{}]+/g,'').trim()||'panseo'; return t+'_'+(boardMode?'board':'slide')+(cur+1); }
  function saveInk(asInkML){ const d=inkData(); if(!d.strokes.length){ toast('저장할 판서가 없습니다'); return; }
    if(asInkML) download(baseName()+'.inkml',toInkML(d),'application/inkml+xml');
    else download(baseName()+'.ink.json',JSON.stringify(d),'application/json');
    toast('💾 '+d.strokes.length+'획 저장 ('+(asInkML?'InkML':'.ink.json')+')'); }
  saveBtn.addEventListener('click',e=>saveInk(e.shiftKey));

  function chunkify(d){                                    // 손 멈춘 시간으로 구간 나누기
    const gap=d.pauseMs||PAUSE_MS, ss=d.strokes.filter(s=>s.pts&&s.pts.length).slice().sort((a,b)=>a.pts[0][3]-b.pts[0][3]);
    const out=[]; let prevEnd=-Infinity;
    for(const s of ss){ const t0=s.pts[0][3]; if(!out.length||t0-prevEnd>=gap) out.push([]); out[out.length-1].push(s); prevEnd=Math.max(prevEnd,s.pts[s.pts.length-1][3]); }
    return out;
  }
  function addClip(d,key){ clips[key]={data:d,chunks:chunkify(d),played:0,added:[]}; }
  document.querySelectorAll('script.ink-clip').forEach(el=>{
    try{ const d=parseClip(el.textContent); const layer=el.dataset.layer||d.layer||'slide'; const n=+(el.dataset.slide||d.slide||1);
      if(n>=1&&n<=total) addClip(d,(layer==='board'?'board:':'slide:')+n); }catch(err){ console.warn('ink-clip 읽기 실패',err); }
  });

  function finishAnim(){ if(!anim) return; cancelAnimationFrame(anim.raf); for(const o of anim.items) o.s.pts=o.full; anim=null; render(); }
  function playNext(){
    const c=curClip(); if(!c) return false;
    if(anim){ finishAnim(); return true; }                 // 재생 중 클릭 = 이 구간 즉시 완성
    if(c.played>=c.chunks.length) return false;
    const d=c.data, sc=Math.min(innerWidth/d.w, innerHeight/d.h), ox=(innerWidth-d.w*sc)/2, oy=(innerHeight-d.h*sc)/2;
    const chunk=c.chunks[c.played]; let clock=0, prevEnd=null; const items=[];
    for(const s of chunk){ const t0=s.pts[0][3];
      if(prevEnd!=null) clock+=Math.min(Math.max(0,t0-prevEnd),GAP_CAP);
      const full=s.pts.map(a=>({x:ox+a[0]*sc,y:oy+a[1]*sc,p:a[2]==null?0.5:a[2],t:performance.now()}));
      const rel=s.pts.map(a=>clock+(a[3]-t0));
      const obj={color:s.color,size:s.size*Math.max(0.5,Math.min(sc,2)),erase:false,hl:!!s.hl,pts:[]};
      strokes.push(obj); items.push({s:obj,full:full,rel:rel});
      clock=rel[rel.length-1]; prevEnd=s.pts[s.pts.length-1][3]; }
    c.added.push(items.map(o=>o.s)); c.played++; updatePlayUI();
    const start=performance.now();
    anim={items:items,raf:0};
    const step=now=>{ if(!anim) return; const el=now-start; let done=true;
      for(const o of items){ let n=0; while(n<o.rel.length&&o.rel[n]<=el) n++; o.s.pts=o.full.slice(0,Math.max(n,0)); if(n<o.rel.length) done=false; }
      render(); if(done){ anim=null; for(const o of items) o.s.pts=o.full; render(); } else anim.raf=requestAnimationFrame(step); };
    anim.raf=requestAnimationFrame(step);
    return true;
  }
  function unplay(){ const c=curClip(); finishAnim(); if(!c||!c.played) return false;
    const rm=new Set(c.added.pop()); c.played--; setLayer(strokes.filter(s=>!rm.has(s))); render(); updatePlayUI(); return true; }
  function advance(){ const c=curClip(); if(c&&(anim||c.played<c.chunks.length)){ playNext(); return; } go(cur+1); }
  function retreat(){ if(anim){ finishAnim(); } if(unplay()) return; go(cur-1); }
  function setPlay(on){ playMode=!!on&&!!curClip(); playBtn.classList.toggle('on',playMode); if(playMode) pad.style.cursor='pointer'; else if(!erasing&&!moveMode) pad.style.cursor='crosshair'; }
  function updatePlayUI(){ const c=curClip(); playBtn.style.display=c?'':'none';
    if(c) playBtn.textContent='▶ 재생 '+c.played+'/'+c.chunks.length; if(!c&&playMode) setPlay(false); }
  function onEnterLayer(){ const c=curClip(); updatePlayUI(); if(c&&c.played<c.chunks.length){ commitFloat(); clearModes(); setEraser(false); setHighlight(false); setPlay(true); } else if(!c) setPlay(false); }
  playBtn.addEventListener('click',()=>{ if(playMode) setPlay(false); else { commitFloat(); clearModes(); setEraser(false); setHighlight(false); setPlay(true); } });

  // 파일 끌어다 놓기 → 현재 슬라이드(또는 칠판)에 클립으로 부착
  addEventListener('dragover',e=>{ e.preventDefault(); });
  addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return;
    f.text().then(txt=>{ const d=parseClip(txt); finishAnim(); addClip(d,clipKey()); onEnterLayer(); toast('▶ 클립 불러옴 — '+clips[clipKey()].chunks.length+'구간 (클릭·→로 재생)'); })
      .catch(err=>toast('불러오기 실패: '+err.message)); });
  let toastEl=null, toastT=0;
  function toast(msg){ if(!toastEl){ toastEl=document.createElement('div'); toastEl.style.cssText='position:absolute;z-index:6;top:14px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:10px;background:rgba(12,18,28,.85);color:#e8eef7;font-size:14px;pointer-events:none;transition:opacity .3s'; document.getElementById('stage').appendChild(toastEl); }
    toastEl.textContent=msg; toastEl.style.opacity='1'; clearTimeout(toastT); toastT=setTimeout(()=>{ toastEl.style.opacity='0'; },1800); }
  window.panseoInk={clips:clips,inkData:inkData,toInkML:toInkML,fromInkML:fromInkML,chunkify:chunkify,addClip:addClip,advance:advance,retreat:retreat,finish:finishAnim,
    state:()=>({cur:cur+1,boardMode:boardMode,playMode:playMode,animating:!!anim,strokes:strokes.length,clip:curClip()&&{played:curClip().played,chunks:curClip().chunks.length}})};
  onEnterLayer();

  addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); advance(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); retreat(); }
    else if(e.key==='k'||e.key==='K'){ saveInk(e.shiftKey); }
    else if(e.key==='p'){ playBtn.click(); }
    else if(e.key==='b') toggleBoard();
    else if(e.key==='g') toggleGrid();
    else if(e.key==='e') setEraser(!erasing);
    else if(e.key==='c'&&!e.ctrlKey&&!e.metaKey){doClear();}
    else if(e.key==='Escape'){commitFloat();}
    else if(e.key==='s'){ snapEnabled=!snapEnabled; snapBtn.classList.toggle('on',snapEnabled); }
    else if(e.key==='f'){ toggleFs(); }
    else if(e.key==='Delete'||e.key==='Backspace'){ discardFloat(); }
    else if((e.ctrlKey||e.metaKey)&&e.key==='z'){doUndo();}
  });
})();
</script>
</body>
</html>
